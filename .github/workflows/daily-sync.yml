name: Daily CS Knowledge Sync

on:
  schedule:
    # 1) Subah 11:30 AM PKT (6:30 AM UTC)
    # 2) Shaam 5:30 PM PKT (12:30 PM UTC)
    # 3) Raat 11:30 PM PKT (6:30 PM UTC)
    - cron: '30 6,12,18 * * *'
  workflow_dispatch: # Manual run button

permissions:
  contents: write

jobs:
  publish-multiple-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate & Commit Multiple High-Yield Notes
        run: |
          python -c '
          import os, random, datetime, subprocess, time

          topics = [
              ("cpp-systems", "RAII Idiom and Zero-Cost Abstractions in Modern C++",
               "### Resource Acquisition Is Initialization (RAII)\nRAII ties the lifecycle of OS resources to object lifetime on the stack.\n\n```cpp\n#include <fstream>\n#include <mutex>\n\nvoid safe_write(const std::string& data) {\n    static std::mutex mtx;\n    std::lock_guard<std::mutex> lock(mtx);\n    std::ofstream file(\"audit.log\", std::ios::app);\n    file << data << \"\\n\";\n}\n```"),

              ("python-backend", "Generators and Memory-Efficient Streaming in Python",
               "### Evaluating Infinite Sequences with Yield\nStandard list comprehensions allocate entire collections in memory. Generators provide lazy evaluation using state suspension.\n\n```python\ndef stream_heavy_dataset(chunk_size=1024):\n    with open(\"server_logs.txt\", \"r\") as f:\n        while chunk := f.read(chunk_size):\n            yield chunk\n```"),

              ("react-frontend", "React Server Components vs Client Island Hydration",
               "### Architecture of Zero-Bundle-Size Server Components\nServer Components execute strictly on Node/Edge runtime, streaming serialized JSON-like virtual trees to the browser without shipping runtime JavaScript dependencies."),

              ("java-backend", "Java Virtual Threads (Project Loom) Execution",
               "### Lightweight User-Mode Threads in JDK 21+\nVirtual threads decouple execution using carrier thread pooling, allowing millions of concurrent tasks with minimal memory footprint."),

              ("databases", "B-Tree Splitting and Write Amplification in Storage Engines",
               "### B+ Tree Node Splitting\nWhen an index leaf page exceeds the maximum block size, an interior node split occurs. Sequential monotonically increasing keys minimize page split overhead."),

              ("system-design", "Bloom Filter Internals and False Positive Reduction",
               "### Probabilistic Set Membership via Bit Arrays\nA Bloom filter uses $k$ independent hash functions over an $m$-bit array to eliminate expensive disk lookups for non-existent primary keys."),

              ("dsa", "Trie Prefix Tree Implementation for Autocomplete",
               "### Prefix Tree Structure & Invariants\nA Trie stores characters hierarchically to execute prefix searches in $O(L)$ time, where $L$ is word length.")
          ]

          actor_id = os.environ.get("GITHUB_ACTOR_ID", "1234567")
          actor = os.environ.get("GITHUB_ACTOR", "AbdullahAhmed2006")
          user_email = f"{actor_id}+{actor}@users.noreply.github.com"

          subprocess.run(["git", "config", "--global", "user.name", "Abdullah Ahmed"], check=True)
          subprocess.run(["git", "config", "--global", "user.email", user_email], check=True)

          # Pull latest commits to prevent conflict
          subprocess.run(["git", "pull", "--rebase", "origin", "main"], check=False)

          num_commits = random.randint(2, 4)
          selected_topics = random.sample(topics, num_commits)
          now = datetime.datetime.utcnow()
          date_str = now.strftime("%Y-%m-%d")

          for idx, (category, title, content) in enumerate(selected_topics):
              target_dir = f"vault/{category}"
              os.makedirs(target_dir, exist_ok=True)
              time_suffix = int(time.time() * 1000) % 1000000
              slug = title.lower().replace(" ", "-").replace("/", "-").replace("+", "p")
              file_path = f"{target_dir}/{date_str}-{slug}-{time_suffix}.md"

              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(f"# {title}\n\n")
                  f.write(f"- **Author:** Abdullah Ahmed (@AbdullahAhmed2006)\n")
                  f.write(f"- **Timestamp:** {now.isoformat()}Z (Batch #{idx+1})\n")
                  f.write(f"- **Category:** `{category}`\n\n---\n\n")
                  f.write(content)
                  f.write("\n\n---\n*Automated Computer Science & Engineering Architecture Vault.*")

              subprocess.run(["git", "add", file_path], check=True)
              commit_msg = f"docs({category}): add technical study on {title} [batch-{idx+1}]"
              # Safe commit execution
              subprocess.run(f"git commit -m \"{commit_msg}\" || true", shell=True, check=True)
              time.sleep(2)

          # Push all generated commits safely
          subprocess.run(["git", "push", "origin", "main"], check=True)
          '
        env:
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_ACTOR: ${{ github.actor }}
